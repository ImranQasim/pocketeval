[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketeval-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core/pocketeval"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
